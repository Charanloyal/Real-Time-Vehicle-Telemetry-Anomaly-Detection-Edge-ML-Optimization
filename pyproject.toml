[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-telemetry-anomaly-detection"
version = "0.2.0"
description = "Real-time vehicle telemetry anomaly detection with PySpark Structured Streaming, scikit-learn/XGBoost, ONNX Runtime and FastAPI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyarrow>=15,<23",
    "scikit-learn>=1.5,<1.8",
    "xgboost>=2.1,<4",
    "joblib>=1.3,<2",
    "PyYAML>=6.0,<7",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.7,<3",
    "matplotlib>=3.8,<4",
    "onnxruntime>=1.20,<2",
    "onnx>=1.17,<2",
    "skl2onnx>=1.18,<2",
    "onnxmltools>=1.13,<2",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5,<4.2"]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "ruff>=0.8,<1",
    "mypy>=1.13,<3",
    "types-PyYAML>=6",
    "pandas-stubs>=2.2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vehicle_anomaly = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "spark: requires PySpark and a Java runtime (skipped automatically when unavailable)",
]
filterwarnings = [
    "ignore::DeprecationWarning:pyspark.*",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, naming, simplify, ruff-specific
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # unicode units (°C, m/s²) in strings and docs are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N806"]
# scikit-learn transformer API uses an upper-case `X` argument.
"src/vehicle_anomaly/preprocessing.py" = ["N803"]
# `from pyspark.sql import functions as F` is the PySpark convention.
"src/vehicle_anomaly/streaming.py" = ["N812"]

[tool.mypy]
python_version = "3.11"
platform = "linux"            # same results locally (Windows) and in CI; Windows-only branches are skipped
mypy_path = "src"
packages = ["vehicle_anomaly"]
strict = true
warn_unreachable = true
disallow_subclassing_any = false   # scikit-learn base classes are untyped
# Third-party libraries without type information.
[[tool.mypy.overrides]]
module = [
    "sklearn.*", "joblib.*", "xgboost.*", "pyspark.*", "onnx.*", "onnxruntime.*", "skl2onnx.*",
    "onnxmltools.*", "matplotlib.*", "pyarrow.*",
]
ignore_missing_imports = true
