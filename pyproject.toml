[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-telemetry-anomaly-detection"
version = "0.1.0"
description = "Real-time vehicle telemetry anomaly detection with PySpark Structured Streaming, scikit-learn/XGBoost and FastAPI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyarrow>=15,<23",
    "scikit-learn>=1.5,<1.8",
    "xgboost>=2.1,<4",
    "joblib>=1.3,<2",
    "PyYAML>=6.0,<7",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.7,<3",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5,<4.2"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vehicle_anomaly = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "spark: requires PySpark and a Java runtime (skipped automatically when unavailable)",
]
filterwarnings = [
    "ignore::DeprecationWarning:pyspark.*",
]
