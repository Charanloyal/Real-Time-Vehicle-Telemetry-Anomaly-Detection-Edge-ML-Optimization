# Render Blueprint: https://render.com/docs/blueprint-spec
# Create the service from the Render dashboard (New > Blueprint) or with the "Deploy to Render" button
# in README.md. Render builds ./Dockerfile, injects PORT, and routes traffic only after /health returns 200.
services:
  - type: web
    name: vehicle-telemetry-anomaly-detection
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Deploy every push to main. (`checksPass` would wait for *all* GitHub checks; third-party apps installed
    # on the account, such as Vercel and CodeRabbit, leave queued checks on this repo that never complete.)
    # CI still runs on every push; the /health check keeps a broken build from receiving traffic.
    autoDeployTrigger: commit
    envVars:
      - key: LOG_LEVEL
        value: INFO
      # Serve the ONNX exports with ONNX Runtime (validated for score parity at training time).
      - key: VTAD_RUNTIME
        value: onnx
      # The free plan has a fraction of one CPU; extra inference threads only add contention.
      - key: VTAD_INFERENCE_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
