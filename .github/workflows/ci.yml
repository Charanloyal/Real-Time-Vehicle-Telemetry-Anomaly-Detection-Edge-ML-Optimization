name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python 3.11, Java 17, PySpark)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements-spark.txt
          pip install --no-deps -e .
      - name: Run test suite (including Spark file-source streaming)
        run: python -m pytest -rs

  docker:
    name: Docker image build + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t vehicle-telemetry-anomaly-api:ci .
      - name: Run container like Render (PORT=10000, 1 inference thread)
        run: |
          docker run -d --name vtad -p 10000:10000 \
            -e PORT=10000 -e VTAD_INFERENCE_THREADS=1 -e OMP_NUM_THREADS=1 \
            --memory=512m --cpus=0.5 \
            vehicle-telemetry-anomaly-api:ci
      - name: Smoke test
        run: python3 scripts/deploy_smoke_test.py --url http://localhost:10000 --wait 120
      - name: Container memory usage
        if: always()
        run: docker stats --no-stream vtad || true
      - name: Container logs
        if: always()
        run: docker logs vtad 2>&1 | tail -n 60
