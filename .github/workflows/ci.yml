name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python 3.11, Java 17, PySpark)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements-spark.txt
          pip install --no-deps -e .
      - name: Run test suite (including Spark file-source streaming)
        run: python -m pytest -rs --junitxml=pytest-results.xml
      - name: Require that no test was skipped (Spark must run on Linux)
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("pytest-results.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          total, failures, errors, skipped = (int(suite.get(k)) for k in ("tests", "failures", "errors", "skipped"))
          passed = total - failures - errors - skipped
          print(f"::notice title=pytest::{passed} passed, {skipped} skipped, {failures + errors} failed (Python 3.11, Java 17, PySpark)")
          if skipped:
              print("::error title=pytest::Tests were skipped in CI; the Spark tests must run on Linux")
              raise SystemExit(1)
          PY

  docker:
    name: Docker image build + smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t vehicle-telemetry-anomaly-api:ci .
      - name: Run container like Render (PORT=10000, 1 inference thread)
        run: |
          docker run -d --name vtad -p 10000:10000 \
            -e PORT=10000 -e VTAD_INFERENCE_THREADS=1 -e OMP_NUM_THREADS=1 \
            --memory=512m --cpus=0.5 \
            vehicle-telemetry-anomaly-api:ci
      - name: Smoke test
        shell: bash
        run: |
          python3 scripts/deploy_smoke_test.py --url http://localhost:10000 --wait 120 | tee smoke.log
          echo "::notice title=Docker smoke test::$(grep -c '^\[PASS\]' smoke.log) checks passed; $(grep 'predict-batch -' smoke.log | sed 's/^\[PASS\] //')"
      - name: Report image size and container memory
        if: always()
        run: |
          size_mb=$(( $(docker image inspect -f '{{.Size}}' vehicle-telemetry-anomaly-api:ci) / 1024 / 1024 ))
          mem=$(docker stats --no-stream --format '{{.MemUsage}}' vtad || echo n/a)
          echo "::notice title=Docker image::size ${size_mb} MB; container memory after smoke test ${mem}"
      - name: Container logs
        if: always()
        run: docker logs vtad 2>&1 | tail -n 60
